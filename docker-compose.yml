services:
  mysql:
    image: mysql:8.4
    container_name: olympia-student-360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: YourPassword
      MYSQL_DATABASE: olympia_student_360_dev
    ports:
      - "3306:3306"
    volumes:
      - olympia-student-360-mysql:/var/lib/mysql

volumes:
  olympia-student-360-mysql:
