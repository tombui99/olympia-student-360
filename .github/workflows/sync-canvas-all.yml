name: Sync all Canvas data since September 2025

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: canvas-production-sync
  cancel-in-progress: false

jobs:
  sync-all:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      APP_RUNNER_SERVICE_ARN: ${{ vars.APP_RUNNER_SERVICE_ARN }}
      Canvas__BaseUrl: ${{ secrets.CANVAS_BASE_URL }}
      Canvas__AccessToken: ${{ secrets.CANVAS_ACCESS_TOKEN }}
      Canvas__AccountId: ${{ secrets.CANVAS_ACCOUNT_ID }}
      # All Olympia terms covering the 2025-2026 and 2026-2027 academic years.
      Canvas__SyncAllEnrollmentTermIds: "227,228,229,230,231,232,333,334,335,336,337,338,339,340"
      Canvas__CreateMissingStudentProfiles: "true"
      ConnectionStrings__DefaultConnection: ${{ secrets.OLYMPIA_RDS_CONNECTION_STRING }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore and build Canvas ETL
        run: |
          dotnet restore backend/OlympiaStudent360.CanvasEtl/OlympiaStudent360.CanvasEtl.csproj
          dotnet build backend/OlympiaStudent360.CanvasEtl/OlympiaStudent360.CanvasEtl.csproj \
            --configuration Release --no-restore

      - name: Configure AWS credentials
        if: env.ConnectionStrings__DefaultConnection == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load the deployed backend database connection
        if: env.ConnectionStrings__DefaultConnection == ''
        run: |
          if [ -z "$APP_RUNNER_SERVICE_ARN" ]; then
            echo "APP_RUNNER_SERVICE_ARN is not configured."
            exit 1
          fi

          service_json=$(aws apprunner describe-service --service-arn "$APP_RUNNER_SERVICE_ARN")
          connection_string=$(printf '%s' "$service_json" | jq -r \
            '.Service.SourceConfiguration.ImageRepository.ImageConfiguration.RuntimeEnvironmentVariables["ConnectionStrings__DefaultConnection"] // empty')
          secret_ref=$(printf '%s' "$service_json" | jq -r \
            '.Service.SourceConfiguration.ImageRepository.ImageConfiguration.RuntimeEnvironmentSecrets["ConnectionStrings__DefaultConnection"] // empty')

          if [ -z "$connection_string" ] && [ -n "$secret_ref" ]; then
            case "$secret_ref" in
              *:secretsmanager:*)
                connection_string=$(aws secretsmanager get-secret-value \
                  --secret-id "$secret_ref" --query SecretString --output text)
                ;;
              *:ssm:*)
                connection_string=$(aws ssm get-parameter \
                  --name "$secret_ref" --with-decryption --query Parameter.Value --output text)
                ;;
            esac
          fi

          if printf '%s' "$connection_string" | jq -e . >/dev/null 2>&1; then
            json_connection=$(printf '%s' "$connection_string" | jq -r \
              '.ConnectionStrings__DefaultConnection // .ConnectionStrings.DefaultConnection // .DefaultConnection // empty')
            if [ -n "$json_connection" ]; then connection_string="$json_connection"; fi
          fi

          if [ -z "$connection_string" ] || [ "$connection_string" = "None" ]; then
            echo "The App Runner service does not expose ConnectionStrings__DefaultConnection to this deployment role."
            exit 1
          fi

          echo "::add-mask::$connection_string"
          echo "ConnectionStrings__DefaultConnection=$connection_string" >> "$GITHUB_ENV"

      - name: Verify direct RDS configuration
        run: |
          if [ -z "$ConnectionStrings__DefaultConnection" ]; then
            echo "Unable to resolve the production database connection."
            exit 1
          fi

      - name: Replace all Canvas data since September 2025 directly in RDS
        run: |
          dotnet run --project backend/OlympiaStudent360.CanvasEtl/OlympiaStudent360.CanvasEtl.csproj \
            --configuration Release --no-build -- --sync-all --replace
