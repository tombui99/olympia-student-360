name: Deploy frontend to AWS S3 and CloudFront

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      DIST_DIR: dist/olympia-student-360/browser

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify session recovery and safe HTTP retries
        run: npm run test:resilience

      - name: Verify report Excel exports
        run: npm run test:reports

      - name: Build Angular production bundle
        run: npm run build

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload frontend to S3
        run: |
          test -f "$DIST_DIR/index.html"
          aws s3 sync "$DIST_DIR" "s3://$S3_BUCKET_NAME" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=300"
          aws s3 cp "$DIST_DIR" "s3://$S3_BUCKET_NAME" --recursive \
            --exclude "*" --include "*.js" --include "*.css" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "$DIST_DIR/index.html" "s3://$S3_BUCKET_NAME/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html" "/"
