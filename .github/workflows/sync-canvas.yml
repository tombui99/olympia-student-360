name: Sync Canvas data

on:
  # schedule:
  # 01:00 Asia/Ho_Chi_Minh (UTC+7). GitHub schedules use UTC.
  # - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-production-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      Canvas__BaseUrl: ${{ secrets.CANVAS_BASE_URL }}
      Canvas__AccessToken: ${{ secrets.CANVAS_ACCESS_TOKEN }}
      Canvas__AccountId: ${{ secrets.CANVAS_ACCOUNT_ID }}
      Canvas__EnrollmentTermIds: ${{ secrets.CANVAS_ENROLLMENT_TERM_IDS }}
      Canvas__WatermarkOverlapMinutes: "120"
      Backend__BaseUrl: ${{ secrets.OLYMPIA_API_BASE_URL }}
      Backend__SyncApiKey: ${{ secrets.CANVAS_SYNC_API_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore and build Canvas ETL
        run: |
          dotnet restore backend/OlympiaStudent360.CanvasEtl/OlympiaStudent360.CanvasEtl.csproj
          dotnet build backend/OlympiaStudent360.CanvasEtl/OlympiaStudent360.CanvasEtl.csproj \
            --configuration Release --no-restore

      - name: Sync Canvas into RDS
        run: |
          dotnet run --project backend/OlympiaStudent360.CanvasEtl/OlympiaStudent360.CanvasEtl.csproj \
            --configuration Release --no-build -- --incremental
