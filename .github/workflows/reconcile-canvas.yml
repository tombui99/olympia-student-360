name: Reconcile recent Canvas data

on:
  # schedule:
  # 02:00 Monday Asia/Ho_Chi_Minh (UTC+7). Reloads late corrections from 30 days.
  # - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: canvas-production-sync
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # Reconciliation revisits both school years and must tolerate Canvas rate limiting.
    timeout-minutes: 240
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      APP_RUNNER_SERVICE_ARN: ${{ vars.APP_RUNNER_SERVICE_ARN }}
      Canvas__BaseUrl: ${{ vars.CANVAS_BASE_URL || secrets.CANVAS_BASE_URL || 'https://lms.theolympiaschools.edu.vn' }}
      Canvas__AccessToken: ${{ secrets.CANVAS_ACCESS_TOKEN }}
      Canvas__AccountId: ${{ vars.CANVAS_ACCOUNT_ID || secrets.CANVAS_ACCOUNT_ID || '1' }}
      # Current 2026-27 terms used by the normal active-year scope.
      Canvas__EnrollmentTermIds: "333,334,335,336,337,338,339,340"
      # Reconciliation retains active-student history from September 2025 onward, so it includes
      # both the 2025-26 terms (227-232) and 2026-27 terms (333-340). This is an explicit safety
      # boundary, not a list of student/class IDs. Append the next academic year's Canvas term IDs
      # during rollover; remove an older group only when its reporting retention is intentionally
      # retired. Term details for 333-340 are documented in sync-canvas.yml.
      Canvas__SyncAllEnrollmentTermIds: "227,228,229,230,231,232,333,334,335,336,337,338,339,340"
      ConnectionStrings__DefaultConnection: ${{ secrets.OLYMPIA_RDS_CONNECTION_STRING }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore and build Canvas ETL
        run: |
          dotnet restore backend/OlympiaStudent360.CanvasEtl/OlympiaStudent360.CanvasEtl.csproj
          dotnet build backend/OlympiaStudent360.CanvasEtl/OlympiaStudent360.CanvasEtl.csproj \
            --configuration Release --no-restore

      - name: Configure AWS credentials
        if: env.ConnectionStrings__DefaultConnection == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load the deployed backend database connection
        if: env.ConnectionStrings__DefaultConnection == ''
        run: |
          service_json=$(aws apprunner describe-service --service-arn "$APP_RUNNER_SERVICE_ARN")
          connection_string=$(printf '%s' "$service_json" | jq -r '.Service.SourceConfiguration.ImageRepository.ImageConfiguration.RuntimeEnvironmentVariables["ConnectionStrings__DefaultConnection"] // empty')
          secret_ref=$(printf '%s' "$service_json" | jq -r '.Service.SourceConfiguration.ImageRepository.ImageConfiguration.RuntimeEnvironmentSecrets["ConnectionStrings__DefaultConnection"] // empty')
          if [ -z "$connection_string" ] && [ -n "$secret_ref" ]; then
            case "$secret_ref" in
              *:secretsmanager:*) connection_string=$(aws secretsmanager get-secret-value --secret-id "$secret_ref" --query SecretString --output text) ;;
              *:ssm:*) connection_string=$(aws ssm get-parameter --name "$secret_ref" --with-decryption --query Parameter.Value --output text) ;;
            esac
          fi
          if printf '%s' "$connection_string" | jq -e . >/dev/null 2>&1; then
            json_connection=$(printf '%s' "$connection_string" | jq -r '.ConnectionStrings__DefaultConnection // .ConnectionStrings.DefaultConnection // .DefaultConnection // empty')
            if [ -n "$json_connection" ]; then connection_string="$json_connection"; fi
          fi
          if [ -z "$connection_string" ] || [ "$connection_string" = "None" ]; then
            echo "Could not load ConnectionStrings__DefaultConnection from App Runner."
            exit 1
          fi
          echo "::add-mask::$connection_string"
          echo "ConnectionStrings__DefaultConnection=$connection_string" >> "$GITHUB_ENV"

      - name: Verify Canvas and direct RDS configuration
        run: |
          missing=()
          if [ -z "$Canvas__BaseUrl" ]; then missing+=("Canvas base URL"); fi
          if [ -z "$Canvas__AccessToken" ]; then missing+=("production secret CANVAS_ACCESS_TOKEN"); fi
          if [ -z "$Canvas__AccountId" ]; then missing+=("Canvas account id"); fi
          if [ -z "$ConnectionStrings__DefaultConnection" ]; then
            missing+=("production database connection")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Unable to start Canvas sync; unresolved configuration: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

      - name: Reconcile the last 30 days
        run: |
          dotnet run --project backend/OlympiaStudent360.CanvasEtl/OlympiaStudent360.CanvasEtl.csproj \
            --configuration Release --no-build -- --reconcile-days=30
