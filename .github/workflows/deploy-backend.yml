name: Deploy backend to AWS App Runner

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "global.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      APP_RUNNER_SERVICE_ARN: ${{ vars.APP_RUNNER_SERVICE_ARN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore and build backend
        run: |
          dotnet restore backend/OlympiaStudent360.sln
          dotnet build backend/OlympiaStudent360.sln --configuration Release --no-restore

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable and latest images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build --file backend/Dockerfile --tag "$image:$IMAGE_TAG" --tag "$image:latest" backend
          docker push "$image:$IMAGE_TAG"
          docker push "$image:latest"

      - name: Start App Runner deployment
        if: env.APP_RUNNER_SERVICE_ARN != ''
        run: aws apprunner start-deployment --service-arn "$APP_RUNNER_SERVICE_ARN"

      - name: Wait for App Runner
        if: env.APP_RUNNER_SERVICE_ARN != ''
        run: |
          for attempt in {1..60}; do
            status=$(aws apprunner describe-service \
              --service-arn "$APP_RUNNER_SERVICE_ARN" \
              --query 'Service.Status' --output text)
            echo "App Runner status: $status"
            if [ "$status" = "RUNNING" ]; then exit 0; fi
            if [[ "$status" == *"FAILED" ]] || [ "$status" = "DELETED" ]; then exit 1; fi
            sleep 10
          done
          echo "Timed out waiting for App Runner deployment."
          exit 1
